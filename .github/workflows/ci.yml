name: Docker Compose CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: python -m pip install --disable-pip-version-check "poetry==2.1.3"

      - name: Check Poetry configuration and lock
        run: poetry check --lock

      - name: Build and start the application
        run: docker compose up --build --detach

      - name: Check API endpoints
        run: |
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8000/health >/dev/null; then
              curl --fail http://localhost:8000/health | python -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
              curl --fail http://localhost:8000/ | python -c 'import json,sys; assert "message" in json.load(sys.stdin)'
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
